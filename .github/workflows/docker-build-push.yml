name: Docker Build and Push to ACR

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'build/*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to build (optional, defaults to current ref)'
        required: false
        type: string

env:
  REGISTRY: registry.cn-shanghai.aliyuncs.com
  NAMESPACE: linran-pub
  IMAGE_NAME: sing-box

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve ref and image tags
        id: ref
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            source_ref="${{ github.event.inputs.tag }}"
          else
            source_ref="${{ github.ref_name }}"
          fi

          image_tag="${source_ref##*/}"
          image_tag="${image_tag//\//-}"

          if [[ "$image_tag" == *"-"* ]]; then
            latest="latest-beta"
          else
            latest="latest"
          fi

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.source_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 同时产出 amd64 / arm64, 覆盖 Linux server 与 macOS ARM (Docker Desktop)
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.latest }}
